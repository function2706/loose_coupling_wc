socks_maker: >-
  {4::{|black |blue |brown |green |red |white |yellow |striped |polka dot }{socks|ankle socks|kneehighs|thighhighs}|1::{fishnet {socks|thighhighs}|garter belt|garter straps|loose socks}}
pantyhose_maker: >-
  {|black |beige |brown |red |white |fishnet }pantyhose
socks:
  random:
    - __socks/casual__
    - __socks/cosplay__
  casual:
    - __socks/below/make__,{__socks_maker__|__pantyhose_maker__}
    - __socks/not_below/make__,{__socks_maker__|__pantyhose_maker__}
  cosplay:
    - __socks/below/make__,__socks/equipments/*__
    - __socks/not_below/make__,__socks/equipments/*__
  below:
    make: |-
      (foot focus),from below,pov,{0-$$,$$toes|soles},five toes,
      __socks/expressions__,
      __socks/below/poses__
    poses:
      - standing on one leg,{hand on hip|crossed arms}
      - sitting on chair,{|crossed legs},{|head rest}
  not_below:
    make: |-
      __socks/expressions__,(looking at viewer),full body,
      (foot focus),{0-$$,$$toes|soles},five toes,
      __socks/not_below/poses__
    poses:
      - sitting,legs together,feet together,extending legs,stretched legs out,arms behind back,
  expressions:
    - light smile
    - naughty face
    - seductive smile
    - smirk{|,closed mouth}
    - smug
  equipments:
    tailor: >-
      {__tailor/tops/random__,{socks,{4::|3::denim |1::bell-bottom,}pants|{socks|kneehighs|thighhighs|pantyhose},{3::|1::bike |1::dolphin |2::denim }shorts|{socks|kneehighs|thighhighs|pantyhose},{|short |long |layered |pencil |pleated }skirt}|
      {socks|kneehighs|thighhighs|pantyhose},{|long |short }{|casual |cocktail |evening |halter |pencil |pinafore |sun}dress},
      __tailor/accessories/random__
    artist: >-
