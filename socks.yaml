socks-maker: >-
  {4::{|black |blue |brown |green |red |white |yellow |striped |polka dot }{socks|ankle socks|kneehighs|thighhighs}|1::{fishnet {socks|thighhighs}|garter belt|garter straps|loose socks}}
pantyhose-maker: >-
  {|black |beige |brown |red |white |fishnet }pantyhose
socks:
  do:
    - __socks/below/make__
    - __socks/not_below/make__
  below:
    make: |-
      (foot focus),from below,pov,{0-$$,$$toes|soles},five toes,
      __socks/expressions__,
      __socks/below/poses__,
      {__socks-maker__|__pantyhose-maker__|__socks/equipments/*__}
    poses:
      - standing on one leg,{hand on hip|crossed arms}
      - sitting on chair,{|crossed legs},{|head rest}
  not_below:
    make: |-
      __socks/expressions__,(looking at viewer),full body,
      (foot focus),{0-$$,$$toes|soles},five toes,
      __socks/not_below/poses__,
      {__socks-maker__|__pantyhose-maker__|__socks/equipments/*__}
    poses:
      - sitting,legs together,feet together,extending legs,stretched legs out,arms behind back,
  expressions:
    - light smile
    - naughty face
    - seductive smile
    - smirk{|,closed mouth}
    - smug
  equipments:
    90s-grunge: >-
      {white|black} socks,__barefoot/equipments/90s-grunge__
    athleisure: >-
      {white|black} {socks|ankle socks|kneehighs|thighhighs},__barefoot/equipments/athleisure__
    barbiecore: >-
      {|fishnet }pantyhose,__barefoot/equipments/barbiecore__
    bdsm: >-
      {{|fishnet }pantyhose|{garter belt|garter straps}},__barefoot/equipments/bdsm__
    bedding: >-
      {|frilled }{|ankle }socks,__barefoot/equipments/bedding__
    bodycon: >-
      {|fishnet }pantyhose,__barefoot/equipments/bodycon__
    bunny-girl: >-
      {{|fishnet }pantyhose|{garter belt|garter straps}},__barefoot/equipments/bunny-girl__
    cheerleader: >-
      {|black |blue |green |red |white |yellow }{socks|ankle socks|kneehighs|thighhighs},__barefoot/equipments/cheerleader__
