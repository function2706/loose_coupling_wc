      blue __latex/equipments/parts/tops__,
      blue __latex/equipments/parts/bottoms__,
      blue __latex/equipments/parts/arm__
    pink: >-
      pink __latex/equipments/parts/footwear__,
      pink __latex/equipments/parts/tops__,
      pink __latex/equipments/parts/bottoms__,
      pink __latex/equipments/parts/arm__
    red: >-
