        - hair pulled back
        - hair slicked back
        - long bangs
        - parted bangs
        - short bangs
        - swept bangs
      extensions:
        do:
          - __subjects/profiles/hair/extensions/tails/do__
          - __subjects/profiles/hair/extensions/updos__
        tails:
          do:
            - "{|__subjects/profiles/hair/extensions/tails/position__ }{|__subjects/profiles/hair/extensions/tails/length__ }__subjects/profiles/hair/extensions/tails/type__"
            - __subjects/profiles/hair/extensions/tails/misc__
          type:
            - ponytail
            - single braid
            - twin braids
            - twintails
          length:
            - long
            - short
          position:
            - high
            - low
            - side
          misc:
            - braided ponytail
            - drill ponytail
            - folded ponytail
            - one side up
            - split ponytail
            - twin drills
            - two side up
            - uneven twintails
            - wide ponytail
        updos:
          - braided bun
          - bun cover
          - cone hair bun
          - double bun
          - doughnut hair bun
          - hair bun
          - single hair bun
          - single side bun
          - tied hair
      sidelocks:
        - sidelocks
        - single sidelock
      bases:
        do:
          - __subjects/profiles/hair/bases/length__{|,__subjects/profiles/hair/bases/style__}{|,__subjects/profiles/hair/bases/option__}
        length:
          - bob cut
          - long hair
          - medium hair
          - pixie cut
          - short hair
          - very long hair
          - very short
        style:
          - asymmetrical hair
          - curly hair
          - curtained hair
          - drill hair
          - flipped hair
          - messy hair
          - spiked hair
          - straight hair
          - wavy hair
        option:
          - blunt ends
          - hair flaps
          - hair intakes
      wholes:
        - hime cut
        - inverted bob
        - low-braided long hair
      colors:
        - black
        - blonde
        - blue
        - brown
        - deep blue
        - grey
        - green
        - light brown
        - pink
        - purple
        - red
        - white
