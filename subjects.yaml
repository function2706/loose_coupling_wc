    hair:
      do:
        - __subjects/profiles/hair/colors__ {1::__subjects/profiles/hair/wholes__|3::__subjects/profiles/hair/random__}
      random:
        - __subjects/profiles/hair/bases/do__,{0-4$$,$$__subjects/profiles/hair/list__}
      list:
        - __subjects/profiles/hair/decorations/do__
        - __subjects/profiles/hair/bangs__
        - __subjects/profiles/hair/extensions/do__
        - __subjects/profiles/hair/sidelocks__
      decorations:
        do:
          - __subjects/profiles/hair/decorations/ahoges__
          - __subjects/profiles/hair/decorations/patterns__
